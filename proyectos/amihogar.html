    <style>
        /* --- ESTILOS GENERALES (RESET) --- */
        * {

        .back-link {

        header {

        .project-meta {

            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;

        }

        .meta-item span {

            color: #888;
            text-transform: uppercase;

        }

        }

        .tag {
            background-color: #eee;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        /* --- CONTENIDO PRINCIPAL (LAYOUT DE 2 COLUMNAS) --- */
        .project-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4rem;
            margin-bottom: 4rem;
        }

        @media (min-width: 850px) {
            .project-content {
                grid-template-columns: 1fr 2fr;
            }
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #888;

        }

            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        .text-block p {
            color: #333;
            font-weight: 300;
            margin-bottom: 1rem;
        }

        .highlights-list {
            list-style: none;
        }

        .highlights-list li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 1rem;
            color: #333;
            font-weight: 300;
        }

        .highlights-list li::before {
            content: "—";
            position: absolute;
            left: 0;
            color: #888;
        }

        .highlights-list strong {
            font-weight: 500;
            color: #000;
        }

        /* --- GALERÍA VISUAL --- */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            margin-top: 2rem;
        }

        .gallery-item {
            width: 100%;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            background-color: #f0f0f0;
        }

        .gallery-item figcaption {
            font-size: 0.8rem;
            color: #777;
            margin-top: 0.6rem;
            font-weight: 300;
        }

        /* --- FOOTER --- */
        footer {
            border-top: 1px solid #e5e5e5;
            padding-top: 2rem;
            margin-top: 5rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #777;
        }
    </style>
</head>
